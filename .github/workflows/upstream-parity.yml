name: Upstream parity

# Replays every upstream moov-io/cadeft commit against this package and reports pass/fail.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Only test the newest N upstream commits (0 = all)"
        default: "0"
  workflow_call:
    inputs:
      limit:
        description: "Only test the newest N upstream commits (0 = all)"
        type: string
        default: "0"
  schedule:
    - cron: "0 6 1 */3 *"
  pull_request:
    paths:
      - "cadeft/**"
      - "tests/**"
      - ".github/workflows/upstream-parity.yml"

concurrency:
  group: parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  parity:
    name: Upstream parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # Results only depend on our code and the upstream SHA, so reuse them
      # until cadeft/ or tests/ change and only test new upstream commits.
      - name: Restore previous results
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: results
          key: parity-${{ hashFiles('cadeft/**', 'tests/**') }}-${{ github.run_id }}
          restore-keys: parity-${{ hashFiles('cadeft/**', 'tests/**') }}-

      - name: Test upstream commits
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT: ${{ github.event_name == 'pull_request' && '10' || inputs.limit || '0' }}
        run: |
          mkdir -p results
          gh api --paginate "repos/moov-io/cadeft/commits?sha=master&per_page=100" \
            --jq '.[] | {sha: .sha, subject: (.commit.message | split("\n")[0])}' \
            | jq -sc --argjson n "$LIMIT" 'if $n > 0 then .[:$n] else . end | .[]' > commits.jsonl
          test_commit() {
            line="$1"
            sha=$(jq -r .sha <<< "$line")
            [ -f "results/$sha.json" ] && return 0
            if CADEFT_GO_REF_COMMIT="$sha" python -m unittest tests.test_parity; then
              outcome=success
            else
              outcome=failure
            fi
            jq -c --arg outcome "$outcome" '. + {outcome: $outcome}' <<< "$line" > "results/$sha.json"
          }
          export -f test_commit
          # Each commit uses its own checkout dir, so they are safe to run concurrently.
          xargs -d '\n' -P 4 -I{} bash -c 'test_commit "$1"' _ {} < commits.jsonl

      - name: Build report
        run: |
          {
            echo "| Upstream commit | Subject | Result |"
            echo "|---|---|---|"
            while read -r line; do
              sha=$(jq -r .sha <<< "$line")
              jq -r '"| [`\(.sha[0:8])`](https://github.com/moov-io/cadeft/commit/\(.sha)) | \(.subject | gsub("\\|"; "/")) | \(if .outcome == "success" then "✅ pass" else "❌ fail" end) |"' "results/$sha.json"
            done < commits.jsonl
          } | tee parity-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-report
          path: parity-report.md
